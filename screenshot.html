<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAM Radio Controller - Screenshot</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }
        .btn {
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 5px;
        }
        .btn-primary { background: linear-gradient(135deg, #3498db, #2980b9); border: none; }
        .btn-success { background: linear-gradient(135deg, #27ae60, #229954); border: none; }
        .btn-danger { background: linear-gradient(135deg, #e74c3c, #c0392b); border: none; }
        .btn-warning { background: linear-gradient(135deg, #f39c12, #e67e22); border: none; }
        .btn-info { background: linear-gradient(135deg, #17a2b8, #138496); border: none; }
        .btn-secondary { background: linear-gradient(135deg, #6c757d, #5a6268); border: none; }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .card-header {
            background: linear-gradient(135deg, #34495e, #2c3e50);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            font-weight: 600;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }
        .input-group-text {
            background: linear-gradient(135deg, #34495e, #2c3e50);
            color: white;
            border: none;
            border-radius: 10px;
        }
        .slider-container {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .status-badge {
            font-size: 0.9em;
            padding: 8px 15px;
            border-radius: 20px;
        }
        .control-panel {
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }
        .frequency-display {
            font-size: 2.5em;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            margin: 15px 0;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 20px;
            border-radius: 15px;
            border: 3px solid #3498db;
        }
        .ptt-btn {
            font-size: 1.5em;
            padding: 15px 30px;
            border-radius: 50px;
        }
        .real-time {
            background: #e8f5e8;
            border-left: 4px solid #27ae60;
        }
        .oled-display {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border: 2px solid #333;
        }
        .oled-line {
            margin: 2px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header text-center">
            <h1><i class="fas fa-broadcast-tower"></i> HAM RADIO CONTROLLER</h1>
            <div class="row mt-3">
                <div class="col-4">
                    <div class="status-badge badge-success">
                        <i class="fas fa-check-circle"></i> MODULE: READY
                    </div>
                </div>
                <div class="col-4">
                    <div class="status-badge badge-primary">
                        <i class="fas fa-wifi"></i> NETWORK: HOME_WIFI
                    </div>
                </div>
                <div class="col-4">
                    <div class="status-badge badge-success">
                        <i class="fas fa-power-off"></i> POWER: ON
                    </div>
                </div>
            </div>
        </div>

        <!-- OLED Display Simulation -->
        <div class="oled-display">
            <div class="oled-line" style="text-align: center; background: #fff; color: #000; padding: 2px;">
                HAM RADIO
            </div>
            <div class="oled-line" style="text-align: center; font-size: 18px; margin: 10px 0;">
                145.600
            </div>
            <div class="oled-line" style="text-align: center; font-size: 10px; margin-bottom: 10px;">
                MHz
            </div>
            <div class="oled-line">
                TX: OFF  PWR: HI  VOL: 4
            </div>
            <div class="oled-line">
                SQL: 1   MOD: OK  NET: WiFi
            </div>
        </div>

        <!-- Navigation -->
        <div class="text-center mb-4">
            <button class="btn btn-outline-primary">
                <i class="fas fa-wifi"></i> WiFi Settings
            </button>
            <button class="btn btn-outline-info">
                <i class="fas fa-list"></i> Channel Manager
            </button>
        </div>

        <!-- Frequency Display -->
        <div class="frequency-display">
            145.6000 MHz
        </div>

        <!-- Control Panel -->
        <div class="control-panel text-center">
            <div class="row">
                <div class="col-4">
                    <button class="btn btn-outline-danger ptt-btn">
                        <i class="fas fa-microphone"></i><br>PTT
                    </button>
                </div>
                <div class="col-4">
                    <button class="btn btn-warning">
                        <i class="fas fa-bolt"></i><br>PWR: 1W
                    </button>
                </div>
                <div class="col-4">
                    <button class="btn btn-success">
                        <i class="fas fa-power-off"></i><br>ON
                    </button>
                </div>
            </div>
        </div>

        <!-- Frequency Settings -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-tune"></i> Frequency Settings
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label for="frequency"><i class="fas fa-wave-square"></i> Frequency (MHz)</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="frequency" value="145.6000">
                        <div class="input-group-append">
                            <button class="btn btn-success"><i class="fas fa-minus"></i></button>
                            <button class="btn btn-success"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="step"><i class="fas fa-arrows-alt-h"></i> Frequency Step</label>
                    <select class="form-control" id="step">
                        <option>2.5 KHz</option>
                        <option>5.0 KHz</option>
                        <option>6.25 KHz</option>
                        <option>10.0 KHz</option>
                        <option selected>12.5 KHz</option>
                        <option>20.0 KHz</option>
                        <option>25.0 KHz</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="channelSpacing"><i class="fas fa-compress-arrows-alt"></i> Channel Spacing</label>
                    <select class="form-control" id="channelSpacing">
                        <option selected>12.5 KHz (Narrow)</option>
                        <option>25 KHz (Wide)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Real-time Audio Settings -->
        <div class="card real-time">
            <div class="card-header">
                <i class="fas fa-sliders-h"></i> Real-time Audio Settings
            </div>
            <div class="card-body">
                <div class="slider-container">
                    <label for="squelch">
                        <i class="fas fa-volume-mute"></i> Squelch Level: <span id="squelchOutput">1</span>
                    </label>
                    <input type="range" class="custom-range" id="squelch" min="0" max="8" value="1">
                    <div class="d-flex justify-content-between">
                        <small>0 (Open)</small>
                        <small>8 (Tight)</small>
                    </div>
                </div>
                
                <div class="slider-container">
                    <label for="volume">
                        <i class="fas fa-volume-up"></i> Volume Level: <span id="volumeOutput">4</span>
                    </label>
                    <input type="range" class="custom-range" id="volume" min="1" max="8" value="4">
                    <div class="d-flex justify-content-between">
                        <small>1 (Low)</small>
                        <small>8 (High)</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- CTCSS Settings -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-code"></i> CTCSS Settings
            </div>
            <div class="card-body">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="txCtcss"><i class="fas fa-sign-out-alt"></i> TX CTCSS</label>
                        <input type="text" class="form-control" id="txCtcss" value="0000">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="rxCtcss"><i class="fas fa-sign-in-alt"></i> RX CTCSS</label>
                        <input type="text" class="form-control" id="rxCtcss" value="0000">
                    </div>
                </div>
            </div>
        </div>

        <!-- Apply Button -->
        <button class="btn btn-primary btn-block btn-lg">
            <i class="fas fa-sync"></i> APPLY FREQUENCY SETTINGS
        </button>

        <!-- Save Channel -->
        <div class="card mt-4">
            <div class="card-header">
                <i class="fas fa-save"></i> Save Channel
            </div>
            <div class="card-body">
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="Enter channel name (e.g. Local Repeater)">
                </div>
                <button class="btn btn-success btn-block">
                    <i class="fas fa-save"></i> SAVE CURRENT SETTINGS
                </button>
            </div>
        </div>

        <!-- Success Message -->
        <div class="alert alert-success mt-3">
            <i class="fas fa-check-circle"></i> Settings Applied Successfully!
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
